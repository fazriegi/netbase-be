name: Docker Build & Deploy (Backend)

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=true
            type=sha,prefix=sha-,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Remote Server (VPS)
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Verify SSH Secrets
        id: check-secrets
        run: |
          if [ -z "${{ secrets.SSH_HOST }}" ] || [ -z "${{ secrets.SSH_KEY }}" ]; then
            echo "::warning::SSH_HOST or SSH_KEY secret is not configured. Skipping remote deployment step."
            echo "configured=false" >> $GITHUB_OUTPUT
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Execute Remote Deployment via SSH
        if: steps.check-secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            TARGET_DIR="${{ secrets.REMOTE_TARGET_DIR || '~/netbase-be' }}"
            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR"

            # If directory is a git repository, pull latest changes (e.g. migration files)
            if [ -d .git ]; then
              echo "Pulling latest git changes..."
              git pull origin master || true
            fi

            # Ensure required local directories and env file exist
            mkdir -p log db/migrations
            touch .env

            echo "Authenticating with GitHub Container Registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo "Writing production compose configuration..."
            echo 'services:
              db:
                image: postgres:16-alpine
                container_name: netbase-db
                restart: always
                environment:
                  POSTGRES_USER: ${DB_USER:-postgres}
                  POSTGRES_PASSWORD: ${DB_PASSWORD}
                  POSTGRES_DB: ${DB_NAME:-netbase}
                  TZ: Asia/Jakarta
                ports:
                  - "127.0.0.1:${DB_PORT:-5432}:5432"
                volumes:
                  - postgres_data:/var/lib/postgresql/data
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-netbase}"]
                  interval: 5s
                  timeout: 5s
                  retries: 5
                networks:
                  - netbase-network

              migrate:
                image: migrate/migrate
                container_name: netbase-migrate
                restart: "no"
                volumes:
                  - ./db/migrations:/migrations
                command:
                  - -path=/migrations
                  - -database=postgres://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/${DB_NAME:-netbase}?sslmode=${DB_SSLMODE:-disable}
                  - up
                depends_on:
                  db:
                    condition: service_healthy
                networks:
                  - netbase-network

              web:
                image: ghcr.io/${{ github.repository }}:latest
                container_name: netbase-web
                restart: always
                ports:
                  - "127.0.0.1:${PORT:-8080}:8080"
                env_file:
                  - .env
                environment:
                  - TZ=Asia/Jakarta
                  - DATABASE_URL=postgres://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/${DB_NAME:-netbase}?sslmode=${DB_SSLMODE:-disable}
                volumes:
                  - ./log:/app/log
                depends_on:
                  db:
                    condition: service_healthy
                  migrate:
                    condition: service_completed_successfully
                networks:
                  - netbase-network

            networks:
              netbase-network:
                driver: bridge

            volumes:
              postgres_data:' > docker-compose.prod.yml

            echo "Pulling latest backend image..."
            docker compose -f docker-compose.prod.yml pull web

            echo "Stopping old backend container if exists..."
            docker stop netbase-web 2>/dev/null || true
            docker rm netbase-web 2>/dev/null || true

            echo "Deploying backend services..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "Cleaning up dangling images..."
            docker image prune -f

            echo "Backend deployment successful!"
